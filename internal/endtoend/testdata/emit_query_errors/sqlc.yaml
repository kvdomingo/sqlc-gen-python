version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "b559ab8a8ae8d7e726ff88f754d1c2318d08f45af556a65d7c075e835a2e6464"
sql:
  - schema: schema.sql
    queries: query.sql
    engine: postgresql
    codegen:
      - plugin: py
        out: classic
        options:
          package: classic
          emit_sync_querier: true
          emit_async_querier: true
          emit_query_errors: true
          overrides:
            - column: jobs.dict
              py_type: dict[str, int]
      - plugin: py
        out: modern
        options:
          package: modern
          emit_sync_querier: true
          emit_async_querier: true
          emit_query_errors: true
          overrides:
            - column: jobs.dict
              py_type: dict[str, int]
          emit_modern_types: true
