version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "a4a7c14041cf6264a5d93853363ad066efce605e98fbefa1df7d4f444aab9ddb"
sql:
  - schema: schema.sql
    queries: query.sql
    engine: postgresql
    codegen:
      - plugin: py
        out: classic
        options:
          package: classic
          emit_sync_querier: true
          emit_async_querier: true
          emit_generic_querier: true
          emit_querier_protocol: true
      - plugin: py
        out: modern
        options:
          package: modern
          emit_sync_querier: true
          emit_async_querier: true
          emit_generic_querier: true
          emit_querier_protocol: true
          emit_modern_types: true
