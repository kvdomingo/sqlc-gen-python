version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "a861a94f8435eb5b1cc074b00d1d6da98caa5e0b1225992b2132382c50340860"
sql:
  - schema: schema.sql
    queries: queries
    engine: postgresql
    codegen:
      - plugin: py
        out: db
        options:
          package: db
          emit_sync_querier: true
          overrides:
            - db_type: jsonb
              py_type: my_lib.types.Payload
            - db_type: jsonb
              nullable: true
              py_type: my_lib.types.Payload
            - db_type: uuid
              py_type: my_ids.Id
            - column: "users.id"
              py_type: my_ids.UserId
            - column: "authors.id"
              py_type: UUID
              py_import: uuid
            - db_type: bytea
              py_type: bytes
