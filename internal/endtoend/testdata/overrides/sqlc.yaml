version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "a1bb8ebf359696ecc9bee571fb741f479b177e1893246bf57ab5161ad035b738"
sql:
  - schema: schema.sql
    queries: queries
    engine: postgresql
    codegen:
      - plugin: py
        out: db
        options:
          package: db
          emit_sync_querier: true
          overrides:
            - db_type: jsonb
              py_type: my_lib.types.Payload
            - db_type: jsonb
              nullable: true
              py_type: my_lib.types.Payload
            - db_type: uuid
              py_type: my_ids.Id
            - column: "users.id"
              py_type: my_ids.UserId
            - column: "authors.id"
              py_type: UUID
              py_import: uuid
            - db_type: bytea
              py_type: bytes
