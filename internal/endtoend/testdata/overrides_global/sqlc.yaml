version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "6584ef37dfbf68533912113000ad4fc8757a50f67b95801d2c6b7a36ab980c08"
sql:
  - schema: schema.sql
    queries: query.sql
    engine: postgresql
    codegen:
      - plugin: py
        out: db
        options:
          package: db
          emit_sync_querier: true
          rename:
            nickname: handle
options:
  py:
    overrides:
      - db_type: citext
        py_type: my_lib.CIText
    rename:
      nickname: alias
