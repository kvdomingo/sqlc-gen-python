version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "b559ab8a8ae8d7e726ff88f754d1c2318d08f45af556a65d7c075e835a2e6464"
sql:
  - schema: schema.sql
    queries: query.sql
    engine: postgresql
    codegen:
      - plugin: py
        out: db
        options:
          package: db
          emit_sync_querier: true
          rename:
            nickname: handle
options:
  py:
    overrides:
      - db_type: citext
        py_type: my_lib.CIText
    rename:
      nickname: alias
