version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "a9550c28fc0bb7eb327516023a276181ff9336c46323526e275d14ad66c6ffd6"
sql:
  - schema: schema.sql
    queries: query.sql
    engine: postgresql
    codegen:
      - plugin: py
        out: dc
        options:
          package: dc
          emit_sync_querier: true
          emit_async_querier: true
      - plugin: py
        out: pyd
        options:
          package: pyd
          emit_sync_querier: true
          emit_pydantic_models: true
