version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "a1bb8ebf359696ecc9bee571fb741f479b177e1893246bf57ab5161ad035b738"
sql:
  - schema: schema.sql
    queries: query.sql
    engine: postgresql
    codegen:
      - plugin: py
        out: dc
        options:
          package: dc
          emit_sync_querier: true
          emit_async_querier: true
      - plugin: py
        out: pyd
        options:
          package: pyd
          emit_sync_querier: true
          emit_pydantic_models: true
