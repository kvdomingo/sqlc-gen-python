version: "2"
plugins:
  - name: py
    wasm:
      url: file://../../../../bin/sqlc-gen-python.wasm
      sha256: "162996126153245e8a92d66392789f2c19c1ae4ba6cc72da62e449c5fc54fad3"
sql:
  - schema: schema.sql
    queries: query.sql
    engine: postgresql
    codegen:
      - plugin: py
        out: classic
        options:
          package: classic
          emit_sync_querier: true
          emit_async_querier: true
      - plugin: py
        out: modern
        options:
          package: modern
          emit_sync_querier: true
          emit_async_querier: true
          emit_modern_types: true
