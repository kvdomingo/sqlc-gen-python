version: '2'
plugins:
- name: py
  wasm:
    url: file://../bin/sqlc-gen-python.wasm
sql:
- schema: "src/authors/schema.sql"
  queries: "src/authors/query.sql"
  engine: postgresql
  codegen:
  - out: src/authors
    plugin: py
    options:
      package: authors
      emit_sync_querier: true
      emit_async_querier: true
      query_parameter_limit: 5
- schema: "src/booktest/schema.sql"
  queries: "src/booktest/query.sql"
  engine: postgresql
  codegen:
  - out: src/booktest
    plugin: py
    options:
      package: booktest
      emit_async_querier: true
      query_parameter_limit: 5
- schema: "src/jets/schema.sql"
  queries: "src/jets/query-building.sql"
  engine: postgresql
  codegen:
  - out: src/jets
    plugin: py
    options:
      package: jets
      emit_async_querier: true
      query_parameter_limit: 5
- schema: "src/ondeck/schema"
  queries: "src/ondeck/query"
  engine: postgresql
  codegen:
  - out: src/ondeck
    plugin: py
    options:
      package: ondeck
      emit_async_querier: true
      query_parameter_limit: 5
- schema: "src/library/schema.sql"
  queries: "src/library/query.sql"
  engine: postgresql
  codegen:
  - out: src/library
    plugin: py
    options:
      package: library
      emit_sync_querier: true
      emit_async_querier: true
      emit_querier_protocol: true
      emit_query_errors: true
- schema: "src/library_modern/schema.sql"
  queries: "src/library_modern/query.sql"
  engine: postgresql
  codegen:
  - out: src/library_modern
    plugin: py
    options:
      package: library_modern
      emit_sync_querier: true
      emit_async_querier: true
      emit_querier_protocol: true
      emit_query_errors: true
      emit_pydantic_models: true
      emit_str_enum: true
      emit_modern_types: true
      emit_aware_datetime: true
      emit_generic_querier: true
