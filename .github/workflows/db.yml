name: db
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5

        with:
          python-version: "3.14"

      - name: Install python dependencies
        working-directory: ./examples
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile generated fixtures
        run: python -m compileall -q internal/endtoend/testdata

      - name: Type-check feature matrix fixtures
        run: |
          for d in internal/endtoend/testdata/feature_matrix_*; do
            (cd "$d" && mypy --strict --explicit-package-bases db _check.py)
          done

      - name: Test python code
        working-directory: ./examples
        env:
          PG_USER: postgres
          PG_HOST: localhost
          PG_DATABASE: postgres
          PG_PASSWORD: postgres
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          pytest src/tests
